# 复制为 config.yaml 再改（config.yaml 不受版本控制，因为里面可能写你本机的具体路径）
# 这份配置只描述"数据在哪"，脚本读这个文件去找 vault-data，不硬编码任何路径

vault_data_dir: ./vault-data

logseq:
  notes_dir: ${vault_data_dir}/读书笔记
  kg_dir: ${vault_data_dir}/炒股知识图谱/人物
  industry_dir: ${vault_data_dir}/行业观察/人物

finance:
  ledger_path: ${vault_data_dir}/finance/ledger.beancount

# LLM抽取用的模型，按需换成你自己有权限的模型
llm:
  provider: anthropic
  model: claude-sonnet-5
